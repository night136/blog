# Decap CMS 配置 —— 指向 GitHub 仓库 night136/blog
# 文档: https://decapcms.org/docs/configuration-options/

backend:
  name: github
  repo: night136/blog
  branch: main
  # OAuth 中继：base_url 是你的 Worker 根地址；auth_endpoint 是相对路径
  base_url: https://blog-oauth-provider.zhongfangxin682.workers.dev
  auth_endpoint: /oauth/authorize

# 站点地址（CMS 预览与回调用，改成你的博客真实域名）
site_url: https://blog.zhongfangxin682.workers.dev
display_url: https://blog.zhongfangxin682.workers.dev

# 编辑工作流：保存文章为草稿，审核后再发布
publish_mode: editorial_workflow

# 文件搜索/图片上传（路径相对仓库根目录）
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# 文章集合
collections:
  - name: "posts"
    label: "文章"
    folder: "content/posts"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    fields:
      - { name: title, label: "标题", widget: string }
      - { name: date, label: "日期", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: tag, label: "分类标签", widget: string }
      - { name: author, label: "作者", widget: string, default: "昉昕" }
      - { name: summary, label: "摘要", widget: text }
      - { name: cover, label: "封面图", widget: image, required: false }
      - { name: body, label: "正文", widget: markdown, buttons: [bold, italic, code, link, heading-two, heading-three, quote, bulleted-list, numbered-list] }
    summary: "{{title}}"
