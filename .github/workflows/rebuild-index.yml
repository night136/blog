name: Rebuild posts index

on:
  push:
    branches: [main]
    paths:
      - "content/posts/**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rebuild index.json
        run: node scripts/build-index.js
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/index.json
          git diff --cached --quiet || git commit -m "chore: auto-rebuild posts index [skip ci]"
          git push
